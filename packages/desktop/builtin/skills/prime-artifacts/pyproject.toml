[project]
name = "prime-artifacts"
version = "1.0.0"
description = "Prime Desktop document, workbook, slide, PDF and data toolkit"
requires-python = ">=3.11"
dependencies = ["python-docx==1.2.0", "openpyxl==3.1.5", "python-pptx==1.0.2", "pypdf==5.9.0", "reportlab==4.4.3", "pandas==2.3.3", "matplotlib==3.10.7", "Pillow==11.3.0"]
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/prime_artifacts"]
