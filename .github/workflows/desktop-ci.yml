name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    if: github.repository == 'chaneegyu1892/PrimeAgent_Desktop'
    runs-on: macos-14
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/desktop/package-lock.json
      - name: Install dependencies
        run: |
          npm install --global npm@11.17.0 --min-release-age=7
          npm ci --workspaces=false --ignore-scripts --min-release-age=7
      - name: Build desktop
        run: npm run build
      - name: Check types and formatting
        run: npm run check
      - name: Test desktop
        run: npm test
